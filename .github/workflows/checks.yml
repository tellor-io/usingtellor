name: Checks
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:

jobs:
  Security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Slither Static Analysis
        uses: actions/setup-node@v1
        with:
          node-version: '24.x'
      - run: npm install
