name: Checks
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:

jobs:
  Linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g solhint
      - run: solhint 'contracts/**/*.sol'
  Security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Slither Static Analysis
        uses: actions/setup-node@v1
        with:
          node-version: '14.x'
      - run: npm install
